apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: test-registry
  namespace: quay-registry
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  configBundleSecret: quay-config-bundle
  # TODO: Remove resource overrides before deploying to staging.
  # These are only needed for local CRC testing where resources are limited.
  # The staging cluster has sufficient resources to use operator defaults.
  components:
    - kind: quay
      managed: true
      overrides:
        replicas: 1
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
    - kind: postgres
      managed: true
      overrides:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
    - kind: redis
      managed: true
    - kind: objectstorage
      managed: false
    - kind: tls
      managed: true
    - kind: route
      managed: true
    - kind: clair
      managed: false
    - kind: clairpostgres
      managed: false
    - kind: horizontalpodautoscaler
      managed: false
    - kind: mirror
      managed: false
    - kind: monitoring
      managed: false
